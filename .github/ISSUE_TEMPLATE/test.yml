name: test
description: 추가하거나 변경할 테스트의 이슈를 기록하세요
labels: ["테스트 추가"]
body:
  - type: textarea
    id: explanation
    attributes:
      label: 테스트 추가 / 변경 사항
      description: 추가되거나 변경되는 테스트의 설명을 적어주세요! (ex. - 회원가입 로직 테스트 추가...)
      placeholder: |
        - 변경 설명 1
        - 변경 설명 2
        - 변경 설명 3
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: 체크리스트
      description: 체크할 체크리스트를 적어주세요. 마크다운 체크박스(- [ ] 내용)형식으로 작성하면 제출 후 체크박스로 표시됩니다.
      placeholder: |
        - [ ] 할 일 1
        - [ ] 할 일 2
        - [ ] 할 일 3
