x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  backend:
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m
  mysql:
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m
  redis:
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
