cors:
  allowedOrigins:
  - ${CORS_CLIENT_ORIGIN:*}

jwt:
  secret: ${JWT_SECRET:asdfasdfasdfasdfasdfasdfasdfasdf}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRY:36000000} # 1 hour
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRY:604800000} # 7 days

spring:
  application:
    name: xquare-infra-v3
  web:
    resources:
      add-mappings: false
  jackson:
    default-property-inclusion: non_null

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/xquare-infra}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect