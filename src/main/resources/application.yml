spring:
  application:
    name: xquare-infra-v3

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/xquare-infra}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect