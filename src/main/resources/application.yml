cors:
  allowedOrigins:
  - ${CORS_CLIENT_ORIGIN:*}

jwt:
  secret: ${JWT_SECRET:asdfasdfasdfasdfasdfasdfasdfasdf}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRY:36000000} # 1 hour
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRY:604800000} # 7 days

email-otp:
  support-email: ${EMAIL_OTP_SUPPORT_EMAIL:abeua8684@gmail.com}
  template-name: ${EMAIL_OTP_TEMPLATE_NAME:email/otp}
  expires-in-text: "${EMAIL_OTP_EXPIRES_IN_TEXT:5분}"
  otp-ttl-seconds: ${EMAIL_OTP_TTL_SECONDS:300}
  verified-token-ttl-seconds: ${EMAIL_OTP_VERIFIED_TOKEN_TTL_SECONDS:600}
  register-subject: "${EMAIL_OTP_REGISTER_SUBJECT:[Xquare] 이메일 인증 코드}"
  username-recovery-subject: "${EMAIL_OTP_USERNAME_RECOVERY_SUBJECT:[Xquare] 아이디 찾기 코드}"
  password-reset-subject: "${EMAIL_OTP_PASSWORD_RESET_SUBJECT:[Xquare] 비밀번호 재설정 코드}"

spring:
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML
    cache: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  application:
    name: xquare-infra-v3
  web:
    resources:
      add-mappings: false
  jackson:
    default-property-inclusion: non_null

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/xquare-infra}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB


okhttp:
  cache-dir: ${OKHTTP_CACHE_DIR}
  cache-size-mb: ${OKHTTP_CACHE_SIZE_MB}

github-app:
  client-id: ${GITHUB_APP_CLIENT_ID}
  client-secret: ${GITHUB_APP_CLIENT_SECRET}
  redirect-uri: ${GITHUB_APP_REDIRECT_URI}

gitops:
  token: ${GITOPS_TOKEN}
  owner: ${GITOPS_REPO_OWNER}
  repo: ${GITOPS_REPO_NAME}
  branch: ${GITOPS_REPO_BRANCH}

argo-workflows:
  url: ${ARGO_WORKFLOWS_URL}
  token: ${ARGO_WORKFLOWS_TOKEN}

vault:
  url: ${VAULT_URL}
  token: ${VAULT_TOKEN}
  mount: ${VAULT_MOUNT}

swagger:
  user: ${SWAGGER_USER}
  password: ${SWAGGER_PASSWORD}

s3:
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
  region: ${S3_REGION:ap-northeast-2}
  bucket: ${S3_BUCKET}
