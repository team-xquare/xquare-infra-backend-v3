<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="margin:0;padding:0;background:#f4f4f4;font-family:Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center" style="padding:40px 0;">
            <table width="600" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:8px;overflow:hidden;">

                <tr>
                    <td style="padding:12px 32px;background:#f8f8f8;font-size:13px;color:#999;">
                        Xquare
                    </td>
                </tr>

                <tr>
                    <td style="padding:40px 32px 24px;">
                        <h1 style="margin:0 0 24px;font-size:24px;font-weight:700;color:#111;">
                            이메일 인증 코드 안내
                        </h1>
                        <p style="margin:0 0 8px;font-size:15px;color:#333;">안녕하세요.</p>
                        <p th:text="${otpGuideText}" style="margin:0 0 32px;font-size:15px;color:#333;">
                            인증 코드를 입력해주세요.
                        </p>

                        <div style="background:#f0f0f0;border-radius:8px;padding:28px;text-align:center;margin-bottom:32px;">
                            <span th:text="${otp}"
                                  style="font-size:36px;font-weight:700;letter-spacing:8px;color:#111;">
                            </span>
                        </div>

                        <p style="margin:0 0 8px;font-size:14px;color:#666;">
                            인증 코드는 <strong th:text="${expiresIn}">5분</strong> 동안 유효합니다.
                        </p>
                        <p style="margin:0;font-size:14px;color:#666;">
                            본인이 요청하지 않았다면 이 이메일은 무시하셔도 됩니다.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td style="padding:20px 32px;background:#f8f8f8;border-top:1px solid #eee;">
                        <p style="margin:0;font-size:12px;color:#aaa;">
                            문의: <span th:text="${supportEmail}">support@example.com</span><br>
                            © <span th:text="${year}">2026</span> Xquare
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
