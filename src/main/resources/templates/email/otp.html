<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>이메일 인증</title>
</head>

<body
        style="
      margin: 0;
      padding: 0;
      background-color: #f5f6f8;
      font-family: Arial, sans-serif;
    "
>
<table
        width="100%"
        cellpadding="0"
        cellspacing="0"
        style="padding: 40px 16px"
>
    <tr>
        <td align="center">
            <table
                    width="100%"
                    cellpadding="0"
                    cellspacing="0"
                    style="
              max-width: 520px;
              background: #ffffff;
              border-radius: 24px;
              padding: 48px 40px;
            "
            >
                <tr>
                    <td>
                        <div
                                style="
                    font-size: 14px;
                    font-weight: 700;
                    color: #2563eb;
                    margin-bottom: 32px;
                  "
                        >
                            XQUARE
                        </div>

                        <div
                                style="
                    font-size: 32px;
                    line-height: 1.35;
                    font-weight: 700;
                    color: #111111;
                    margin-bottom: 18px;
                    letter-spacing: -0.5px;
                  "
                        >
                            이메일 인증 코드
                        </div>

                        <div
                                style="
                    font-size: 15px;
                    line-height: 1.7;
                    color: #8b95a1;
                    margin-bottom: 36px;
                  "
                        >
                            아래 인증번호를 확인한 뒤<br />
                            서비스 화면에 입력해주세요.
                        </div>

                        <table
                                width="100%"
                                cellpadding="0"
                                cellspacing="0"
                                style="
                    background: #f7f8fa;
                    border-radius: 20px;
                    margin-bottom: 36px;
                  "
                        >
                            <tr>
                                <td align="center" style="padding: 32px 20px">
                                    <div
                                            style="
                          font-size: 14px;
                          color: #8b95a1;
                          margin-bottom: 12px;
                        "
                                    >
                                        인증번호
                                    </div>

                                    <div
                                            th:text="${otp}"
                                            style="
                          font-size: 42px;
                          font-weight: 700;
                          color: #2563eb;
                          letter-spacing: 10px;
                        "
                                    ></div>
                                </td>
                            </tr>
                        </table>

                        <div
                                style="
                    font-size: 14px;
                    line-height: 1.7;
                    color: #8b95a1;
                    margin-bottom: 32px;
                  "
                        >
                            인증번호는 <span th:text="${expiresIn}"></span> 동안 유효합니다.<br />
                            본인이 요청하지 않았다면 이 메일을 무시해주세요.
                        </div>

                        <div
                                style="
                    border-top: 1px solid #eeeeee;
                    padding-top: 24px;
                    font-size: 13px;
                    color: #b0b8c1;
                    line-height: 1.6;
                  "
                        >
                            문의: <span th:text="${supportEmail}"></span><br />
                            © <span th:text="${year}"></span> XQUARE. All rights reserved.
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
